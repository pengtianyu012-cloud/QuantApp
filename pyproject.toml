[project]
name = "quant-app"
version = "0.1.0"
description = "Windows桌面端A股量化模拟交易系统"
requires-python = ">=3.13.2,<3.14"
dependencies = [
    "PySide6>=6.7,<7",
    "pandas>=2.2,<4",
    "numpy>=1.26,<3",
    "SQLAlchemy>=2.0,<3",
    "akshare>=1.18,<2",
    "requests>=2.32,<3",
    "truststore>=0.10,<1",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "ruff>=0.5,<1",
    "pyinstaller>=6,<7",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = []

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
